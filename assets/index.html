<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Bot Client</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <div id="view-login" class="view active">
            <div class="login-wrap">
                <div class="login-menu">
                    <div class="login-header">
                        <div class="brand-icon">
                            <svg viewBox="0 0 240 240" width="56" height="56">
                                <circle cx="120" cy="120" r="120" fill="url(#tgGrad)" />
                                <defs>
                                    <linearGradient id="tgGrad" x1="0" y1="0" x2="0" y2="1">
                                        <stop offset="0" stop-color="#37BBFE" />
                                        <stop offset="1" stop-color="#007DBB" />
                                    </linearGradient>
                                </defs>
                                <path fill="#fff"
                                    d="M167 72l-21.6 102c-1.6 7.3-5.9 9.1-12 5.7l-33.1-24.4-16 15.4c-1.8 1.8-3.3 3.3-6.7 3.3l2.4-33.9L143 84.6c2.9-2.6-.6-4-4.5-1.4l-63.6 40-27.4-8.6c-6-1.9-6.1-6 1.3-8.9l107-41.2c5-1.9 9.4 1.2 7.8 8.5z" />
                            </svg>
                        </div>
                        <h1>Bot Client</h1>
                        <p>Select a bot</p>
                    </div>
                    <div class="acc-list" id="botList"></div>
                </div>
            </div>
        </div>
        <div class="modal-overlay" id="addOverlay">
            <div class="add-menu" id="addMenu">
                <h3>Add a bot</h3>
                <p class="add-sub">صلى علي النبي</p>
                <input type="password" id="tokenInput" placeholder="Telegram Bot Token" autocomplete="off">
                <div class="add-error" id="addError"></div>
                <div class="add-actions">
                    <button class="cancel-btn" id="cancelAddBtn">Cancel</button>
                    <button class="add-btn" id="addBtn">
                        <span class="btn-text">Add Bot</span>
                        <span class="spinner" id="addSpinner" hidden></span>
                    </button>
                </div>
            </div>
        </div>
        <div class="dropmenu" id="dropmenu">
            <div class="option delete" id="deleteBotOption">
                <svg viewBox="0 0 24 24" width="18" height="18">
                    <path fill="currentColor"
                        d="M9 3h6l1 2h5v2H3V5h5l1-2zm-3 6h12l-1 12H7L6 9zm4 2v8h1v-8H10zm3 0v8h1v-8h-1z" /></svg>
                <p>Delete Bot</p>
            </div>
        </div>
        <div id="view-main" class="view">
            <div class="tg-container">
                <div class="sidebar" id="sidebar">
                    <div class="sidebar-header">
                        <button class="icon-btn" id="backToLogin" title="Back to bots">
                            <svg viewBox="0 0 24 24" width="22" height="22">
                                <path fill="currentColor" d="M15.5 4.5l-7.5 7.5 7.5 7.5-1.5 1.5-9-9 9-9z" /></svg>
                        </button>
                        <div class="search-box">
                            <svg viewBox="0 0 24 24" width="18" height="18">
                                <path fill="currentColor"
                                    d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5L20.49 19l-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z" />
                                </svg>
                            <input type="text" id="searchInput" placeholder="Search chats">
                        </div>
                        <div class="bot-mini" id="currentBotMini"></div>
                    </div>
                    <div class="chat-list" id="chatList"></div>
                </div>
                <div class="chat-panel" id="chatPanel">
                    <div class="chat-empty" id="chatEmpty">
                        <svg viewBox="0 0 240 240" width="120" height="120" opacity="0.15">
                            <path fill="currentColor"
                                d="M167 72l-21.6 102c-1.6 7.3-5.9 9.1-12 5.7l-33.1-24.4-16 15.4c-1.8 1.8-3.3 3.3-6.7 3.3l2.4-33.9L143 84.6c2.9-2.6-.6-4-4.5-1.4l-63.6 40-27.4-8.6c-6-1.9-6.1-6 1.3-8.9l107-41.2c5-1.9 9.4 1.2 7.8 8.5z" />
                        </svg>
                        <p>Select a chat to start messaging</p>
                    </div>
                    <div class="chat-active" id="chatActive" hidden>
                        <div class="chat-header">
                            <button class="icon-btn mobile-back" id="mobileBackBtn">
                                <svg viewBox="0 0 24 24" width="22" height="22">
                                    <path fill="currentColor" d="M15.5 4.5l-7.5 7.5 7.5 7.5-1.5 1.5-9-9 9-9z" /></svg>
                            </button>
                            <div class="chat-header-avatar" id="chatHeaderAvatar"></div>
                            <div class="chat-header-info">
                                <h3 id="chatHeaderName"></h3>
                                <p id="chatHeaderStatus">chat</p>
                            </div>
                        </div>
                        <div class="messages" id="messagesContainer"></div>
                        <div class="chat-input-bar">
                            <textarea id="messageInput" placeholder="Message" rows="1"></textarea>
                            <button class="send-btn" id="sendBtn" title="Send">
                                <svg viewBox="0 0 24 24" width="22" height="22">
                                    <path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2z" /></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="js/storage.js"></script>
    <script src="js/telegram-api.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
